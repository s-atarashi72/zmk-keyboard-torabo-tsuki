# ---------- Windows 11 でのラグ対策 ----------
# 2 Mbps PHY を無効化し、安定した 1 Mbps に固定
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Central 側（親機側）で接続間隔を 30–50 ms／レイテンシ 0 に固定
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24   # 30 ms
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40   # 50 ms
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ---------- PMW3610 トラックボール調整 ----------
# 250 Hz → 125 Hz 相当へソフト半分取り込み
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# Run → Rest1 ダウンシフトを 1 秒に延長
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=1000
# Rest1 サンプリング間隔を 20 ms（50 Hz）に高速化
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# 微動も即レポート
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
